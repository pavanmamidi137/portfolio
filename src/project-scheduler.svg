    <radialGradient id="r2" cx="0.85" cy="0.95" r="0.9">
      <stop offset="0" stop-color="rgba(139,92,246,0.28)"/>
      <stop offset="1" stop-color="rgba(139,92,246,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#r1)"/>
  <rect width="800" height="500" fill="url(#r2)"/>
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
